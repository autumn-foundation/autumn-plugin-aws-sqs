name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    needs: clippy
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4
        env:
          SERVICES: sqs
        ports:
          - 4566:4566
    env:
      AWS_SQS_IT_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4566/_localstack/health | grep -q '"sqs": "\(available\|running\)"' && exit 0
            sleep 2
          done
          exit 1
      - name: Test with coverage (fail under 85% lines)
        run: cargo llvm-cov --all-targets --fail-under-lines 85 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
